[package]
name = "temporal_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "temporal_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
temporal-sdk-core = { version = "0.1.0-alpha.1" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.0"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"

[features]
default = []
telemetry = []